# fly launch 없이 바로 쓰는 설정. 앱 이름은 `fly apps create <이름>` 뒤에 맞춘다.
app = "visitown-api"
primary_region = "nrt"

[build]
  [build.args]
    NODE_VERSION = "22"

[env]
  PORT = "8787"
  # 레딧 등 몰림 대비(로드맵 61). 랜딩 방문자마다 임베드 SSE 하나라 사이트당 상한을 올리고(넘으면 랜딩이 데모 마을로 바꾼다),
  # 방문자 1명 ≈ 분당 이벤트 4~5개(하트비트 포함)라 사이트당 분당 이벤트 상한도 올린다. 둘 다 server/index.js 기본값(200·6000)을 덮는다
  MAX_SSE_PER_SITE = "1000"
  SITE_EVENTS_PER_MIN = "20000"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false   # 세션이 메모리에 있으므로 끄지 않는다
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"   # 256MB는 SSE 수백 개에 빠듯. 월 1~2달러 차이라 상시 512
