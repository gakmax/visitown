# fly launch 없이 바로 쓰는 설정. 앱 이름은 `fly apps create <이름>` 뒤에 맞춘다.
app = "visitown-api"
primary_region = "nrt"

[build]
  [build.args]
    NODE_VERSION = "22"

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false   # 세션이 메모리에 있으므로 끄지 않는다
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
